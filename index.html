<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>クラスパーカーデザイン</title>
  <meta name="description" content="クラスパーカーのデザインを、画像を重ねて試せるサイト">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23f7d51d'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1>クラスパーカー デザインメーカー</h1>
    <p>下のタブから画像を追加して、パーカーに重ねて試してみよう</p>
  </header>

  <main>
    <div class="toolbar">
      <fieldset class="seg">
        <legend>追加する面</legend>
        <label><input type="radio" name="side" value="front" checked><span>正面</span></label>
        <label><input type="radio" name="side" value="back"><span>背面</span></label>
      </fieldset>
      <div class="spacer"></div>
      <button type="button" id="clearAll" class="btn ghost">すべて消す</button>
      <button type="button" id="savePng" class="btn primary">PNGで保存</button>
    </div>

    <div id="stage" class="stage">
      <img id="hoodie" src="images/hoodie.jpg" alt="黄色のパーカー（左が正面、右が背面）" draggable="false">
      <div id="sel" class="sel" hidden>
        <button type="button" class="handle h-del" id="hDel" aria-label="このデザインを削除">×</button>
        <div class="handle h-rot" id="hRot" role="presentation" title="ドラッグで拡大縮小・回転">⤡</div>
      </div>
    </div>
    <p id="msg" class="msg" role="status"></p>

    <aside id="hint" class="hint">
      <h2>デザインの調整</h2>
      <p>パーカー上のデザインをタップすると、ここで大きさ・回転・色・背景の透明化を調整できます。</p>
      <p>右下の丸いハンドルをドラッグすると拡大縮小と回転、左上の×で削除できます。</p>
    </aside>

    <section id="panel" class="panel" hidden aria-label="選択中のデザインの設定">
      <div class="field">
        <label for="size">大きさ</label>
        <input type="range" id="size" min="3" max="100" step="1">
      </div>
      <div class="field">
        <label for="rot">回転</label>
        <input type="range" id="rot" min="-180" max="180" step="1">
      </div>

      <div class="group">
        <h2>色を変える</h2>
        <p class="note">画像の形（透明な部分と、透明にした背景以外）を一色で塗ります。</p>
        <div class="swatches" id="presets"></div>
        <div class="row">
          <label class="color-pick">好きな色
            <input type="color" id="tint" value="#e53935">
          </label>
          <button type="button" id="tintReset" class="btn ghost">元の色に戻す</button>
        </div>
      </div>

      <div class="group">
        <h2>背景を透明にする</h2>
        <p class="note">下の画像をクリックして、透明にしたい色（白でも他の色でも）を選びます。</p>
        <canvas id="bgPreview" class="bg-preview" aria-label="透明にする色を選ぶための元画像"></canvas>
        <div class="row">
          <span class="chip" id="bgChip">透明にする色: なし</span>
          <button type="button" id="bgAuto" class="btn ghost">四隅の色で自動</button>
          <button type="button" id="bgClear" class="btn ghost">解除</button>
        </div>
        <div class="field">
          <label for="tol">色の近さ（大きいほど広く透明に）</label>
          <input type="range" id="tol" min="0" max="100" step="1">
        </div>
      </div>

      <div class="row actions">
        <button type="button" id="toFront" class="btn ghost">手前へ</button>
        <button type="button" id="toBack" class="btn ghost">奥へ</button>
        <button type="button" id="dup" class="btn ghost">複製</button>
        <button type="button" id="del" class="btn danger">削除</button>
      </div>
    </section>
  </main>

  <nav class="tabbar" aria-label="デザイン画像">
    <div class="tabs">
      <span class="tab-label">マイデザイン</span>
      <label class="btn primary add">
        ＋ 画像を追加
        <input type="file" id="file" accept="image/*" multiple hidden>
      </label>
    </div>
    <div id="tray" class="tray"></div>
  </nav>

  <script src="app.js"></script>
</body>
</html>
